<html lang="ar" dir="rtl">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎓 اختبار اللغة الإنجليزية</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #f5f5f7;
    overflow: hidden;
    user-select: none;
  }
  body { display: flex; align-items: center; justify-content: center; }
  #app {
    width: 100%;
    max-width: 500px;
    height: 100%;
    max-height: 100vh;
    background: white;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  #stage-selection {
    padding: 20px 16px;
    overflow-y: auto;
    height: 100%;
  }
  #stage-selection h1 {
    font-size: 28px;
    text-align: center;
    margin: 16px 0 24px;
    color: #111;
  }
  .stage-btn {
    display: block;
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 8px;
    font-size: 17px;
    font-weight: 700;
    text-align: center;
    background: #ebebeb;
    border: 1px solid #bfbfbf;
    border-radius: 14px;
    cursor: pointer;
    color: #111;
    white-space: pre-line;
    transition: background 0.15s;
  }
  .stage-btn:active { background: #d8d8d8; }

  #quiz {
    display: none;
    flex-direction: column;
    height: 100%;
    padding: 8px 12px 12px;
    overflow-y: auto;
  }
  #question-label {
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    color: #111;
    padding: 8px 4px;
    line-height: 1.3;
  }
  #stage-label {
    font-size: 17px;
    font-weight: 700;
    text-align: center;
    color: #2659bf;
    padding: 4px 0;
  }
  #emoji-display {
    font-size: 84px;
    text-align: center;
    padding: 8px 0;
    line-height: 1.2;
    min-height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #color-circle-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 8px 0;
    min-height: 110px;
  }
  #color-circle {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: 2px solid #bfbfbf;
  }
  #errors-label {
    font-size: 17px;
    font-weight: 700;
    text-align: center;
    color: red;
    padding: 4px 0;
  }
  #score-label {
    font-size: 19px;
    font-weight: 700;
    text-align: center;
    color: #2673e6;
    padding: 4px 0;
  }
  #name-label {
    font-size: 32px;
    font-weight: 700;
    text-align: center;
    color: #cc1a1a;
    padding: 4px 0;
  }
  #options {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 12px;
  }
  .opt-btn {
    display: block;
    width: 100%;
    padding: 14px;
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    background: #ebebeb;
    color: #0d59e6;
    border: 2px solid #b3b3b3;
    border-radius: 14px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .opt-btn:active { background: #d8d8d8; }
  .opt-btn.correct {
    background: #4dcc4d !important;
    border-color: green !important;
    border-width: 3px !important;
    color: white !important;
  }
  .opt-btn.wrong {
    background: #ff4d4d !important;
    border-color: red !important;
    border-width: 3px !important;
    color: white !important;
  }
  .opt-btn.disabled-other {
    background: #d9d9d9 !important;
    border-color: #b3b3b3 !important;
    border-width: 2px !important;
    color: #666 !important;
  }
  #result-label {
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    padding: 10px 0;
    min-height: 44px;
  }
  #result-label.correct-text { color: green; }
  #result-label.wrong-text { color: red; }

  #results {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 20px;
    text-align: center;
    overflow-y: auto;
  }
  #results h2 {
    font-size: 28px;
    margin-bottom: 12px;
    color: #111;
  }
  #results .info { font-size: 22px; font-weight: 700; color: #595959; margin-bottom: 16px; }
  #results .final-score { font-size: 26px; font-weight: 700; color: #1a66e6; margin-bottom: 8px; }
  #results .percent { font-size: 34px; font-weight: 700; color: #1a66e6; margin-bottom: 12px; }
  #results .rating { font-size: 26px; font-weight: 700; margin-bottom: 24px; }
  .result-btn {
    display: block;
    width: 100%;
    max-width: 360px;
    padding: 14px;
    margin-bottom: 12px;
    font-size: 20px;
    font-weight: 700;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    color: white;
  }
  .result-btn.replay { background: #3399ff; }
  .result-btn.continue { background: #1aa633; }
  .result-btn.back { background: #ebebeb; color: #111; border: 1px solid #bfbfbf; }
  .result-btn:active { filter: brightness(0.9); }
</style>
</head>

</div>
