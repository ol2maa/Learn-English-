<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #f5f5f7;
    overflow: hidden;
    user-select: none;
  }
  body { display: flex; align-items: center; justify-content: center; }
  #app {
    width: 100%;
    max-width: 500px;
    height: 100%;
    max-height: 100vh;
    background: white;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  #stage-selection {
    padding: 20px 16px;
    overflow-y: auto;
    height: 100%;
  }
  #stage-selection h1 {
    font-size: 28px;
    text-align: center;
    margin: 16px 0 24px;
    color: #111;
  }
  .stage-btn {
    display: block;
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 8px;
    font-size: 17px;
    font-weight: 700;
    text-align: center;
    background: #ebebeb;
    border: 1px solid #bfbfbf;
    border-radius: 14px;
    cursor: pointer;
    color: #111;
    white-space: pre-line;
    transition: background 0.15s;
  }
  .stage-btn:active { background: #d8d8d8; }
  #quiz {
    display: none;
    flex-direction: column;
    height: 100%;
    padding: 8px 12px 12px;
    overflow-y: auto;
  }
  #question-label {
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    color: #111;
    padding: 8px 4px;
    line-height: 1.3;
  }
  #stage-label {
    font-size: 17px;
    font-weight: 700;
    text-align: center;
    color: #2659bf;
    padding: 4px 0;
  }
  #emoji-display {
    font-size: 84px;
    text-align: center;
    padding: 8px 0;
    line-height: 1.2;
    min-height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #color-circle-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 8px 0;
    min-height: 110px;
  }
  #color-circle {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: 2px solid #bfbfbf;
  }
  #errors-label {
    font-size: 17px;
    font-weight: 700;
    text-align: center;
    color: red;
    padding: 4px 0;
  }
  #score-label {
    font-size: 19px;
    font-weight: 700;
    text-align: center;
    color: #2673e6;
    padding: 4px 0;
  }
  #name-label {
    font-size: 32px;
    font-weight: 700;
    text-align: center;
    color: #cc1a1a;
    padding: 4px 0;
  }
  #options {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 12px;
  }
  .opt-btn {
    display: block;
    width: 100%;
    padding: 14px;
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    background: #ebebeb;
    color: #0d59e6;
    border: 2px solid #b3b3b3;
    border-radius: 14px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .opt-btn:active { background: #d8d8d8; }
  .opt-btn.correct {
    background: #4dcc4d !important;
    border-color: green !important;
    border-width: 3px !important;
    color: white !important;
  }
  .opt-btn.wrong {
    background: #ff4d4d !important;
    border-color: red !important;
    border-width: 3px !important;
    color: white !important;
  }
  .opt-btn.disabled-other {
    background: #d9d9d9 !important;
    border-color: #b3b3b3 !important;
    border-width: 2px !important;
    color: #666 !important;
  }
  #result-label {
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    padding: 10px 0;
    min-height: 44px;
  }
  #result-label.correct-text { color: green; }
  #result-label.wrong-text { color: red; }
  #results {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 20px;
    text-align: center;
    overflow-y: auto;
  }
  #results h2 {
    font-size: 28px;
    margin-bottom: 12px;
    color: #111;
  }
  #results .info { font-size: 22px; font-weight: 700; color: #595959; margin-bottom: 16px; }
  #results .final-score { font-size: 26px; font-weight: 700; color: #1a66e6; margin-bottom: 8px; }
  #results .percent { font-size: 34px; font-weight: 700; color: #1a66e6; margin-bottom: 12px; }
  #results .rating { font-size: 26px; font-weight: 700; margin-bottom: 24px; }
  .result-btn {
    display: block;
    width: 100%;
    max-width: 360px;
    padding: 14px;
    margin-bottom: 12px;
    font-size: 20px;
    font-weight: 700;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    color: white;
  }
  .result-btn.replay { background: #3399ff; }
  .result-btn.continue { background: #1aa633; }
  .result-btn.back { background: #ebebeb; color: #111; border: 1px solid #bfbfbf; }
  .result-btn:active { filter: brightness(0.9); }
</style>
</head>

function generateNumberQuestions() {
  const pool = [];
  for (let i = 1; i <= 100; i++) pool.push(i);
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const result = [];
  for (let i = 0; i < 20; i++) {
    const n = pool[i];
    result.push({
      arabic: `🔢 ${n}`,
      correct: String(n),
      question: "🔊 استمع للرقم واختر الإجابة الصحيحة",
      isNumber: true,
      number: n
    });
  }
  return result;
}

// ======================= STATE =======================
const stageData = {
  1: {questions: fruitQuestions, name: "المرحلة الأولى 🍎🥕", score: 0, wrong: 0},
  2: {questions: colorQuestions, name: "المرحلة الثانية 🎨", score: 0, wrong: 0},
  3: {questions: schoolQuestions, name: "المرحلة الثالثة 🏫", score: 0, wrong: 0},
  4: {questions: houseQuestions, name: "المرحلة الرابعة 🏠", score: 0, wrong: 0},
  5: {questions: verbQuestions, name: "المرحلة الخامسة 🔤", score: 0, wrong: 0},
  6: {questions: bodyQuestions, name: "المرحلة السادسة 🧍", score: 0, wrong: 0},
  7: {questions: transportQuestions, name: "المرحلة السابعة 🚗✈️", score: 0, wrong: 0},
  8: {questions: jobsQuestions, name: "المرحلة الثامنة 👨‍⚕️👷", score: 0, wrong: 0},
  9: {questions: numberQuestions, name: "المرحلة التاسعة 🔢", score: 0, wrong: 0}
};

let currentStage = 1;
let currentIndex = 0;
let currentQuestions = [];
let currentOptions = [];
let currentCorrect = "";
let currentArabic = "";
let answered = false;
let allStagesMode = true;
let transitionTimer = null;
let voiceTimers = [];

const stageSel = document.getElementById("stage-selection");
const stageButtonsContainer = document.getElementById("stage-buttons-container");
const quizDiv = document.getElementById("quiz");
const resultsDiv = document.getElementById("results");
const questionLabel = document.getElementById("question-label");
const stageLabel = document.getElementById("stage-label");
const emojiDisplay = document.getElementById("emoji-display");
const colorCircleWrap = document.getElementById("color-circle-wrap");
const colorCircle = document.getElementById("color-circle");
const errorsLabel = document.getElementById("errors-label");
const scoreLabel = document.getElementById("score-label");
const nameLabel = document.getElementById("name-label");
const optionsDiv = document.getElementById("options");
const resultLabel = document.getElementById("result-label");

// ======================= SPEECH =======================
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.45;
  window.speechSynthesis.speak(u);
}

function clearTimers() {
  if (transitionTimer) { clearTimeout(transitionTimer); transitionTimer = null; }
  voiceTimers.forEach(t => clearTimeout(t));
  voiceTimers = [];
  if (window.speechSynthesis) window.speechSynthesis.cancel();
}

// ======================= STAGE SELECTION =======================
const stageButtonsData = [
  ["🍎🥕  المرحلة الأولى\nالفواكه والخضروات", 1],
  ["🎨  المرحلة الثانية\nالألوان", 2],
  ["🏫  المرحلة الثالثة\nالمدرسة", 3],
  ["🏠  المرحلة الرابعة\nالبيت وداخل البيت", 4],
  ["🔤  المرحلة الخامسة\nالأفعال", 5],
  ["🧍  المرحلة السادسة\nالجسم وأجزاؤه", 6],
  ["🚗✈️  المرحلة السابعة\nالمواصلات", 7],
  ["👨‍⚕️👷  المرحلة الثامنة\nالوظائف وما حولها", 8],
  ["🔢  المرحلة التاسعة\nالأرقام (1-100)", 9],
  ["📚  جميع المراحل", 0]
];

function buildStageButtons() {
  stageButtonsContainer.innerHTML = "";
  stageButtonsData.forEach(([title, val]) => {
    const btn = document.createElement("button");
    btn.className = "stage-btn";
    btn.textContent = title;
    btn.onclick = () => selectStage(val);
    stageButtonsContainer.appendChild(btn);
  });
}

function showStageSelection() {
  clearTimers();
  stageSel.style.display = "block";
  quizDiv.style.display = "none";
  resultsDiv.style.display = "none";
  buildStageButtons();
  for (let k in stageData) { stageData[k].score = 0; stageData[k].wrong = 0; }
}

function selectStage(val) {
  clearTimers();
  if (val === 0) {
    allStagesMode = true;
    currentStage = 1;
  } else {
    allStagesMode = false;
    currentStage = val;
  }
  // إعادة توليد أسئلة الأرقام
  if (val === 9 || val === 0) {
    numberQuestions = generateNumberQuestions();
    stageData[9].questions = numberQuestions;
  }
  currentIndex = 0;
  stageData[currentStage].score = 0;
  stageData[currentStage].wrong = 0;
  answered = false;
  loadQuestion();
  showQuizScreen();
}

// ======================= QUIZ LOGIC =======================
function getCurrentQuestions() {
  return stageData[currentStage].questions;
}

function loadQuestion() {
  currentQuestions = getCurrentQuestions();
  const q = currentQuestions[currentIndex];
  currentCorrect = q.correct;
  currentArabic = q.arabic;

  // حالة المرحلة التاسعة: أرقام
  if (q.isNumber) {
    const correctNum = q.number;
    const othersSet = new Set();
    while (othersSet.size < 3) {
      let offset = Math.floor(Math.random() * 20) - 10;
      if (offset === 0) offset = 5;
      let candidate = correctNum + offset;
      if (candidate < 1) candidate = correctNum + Math.abs(offset) + 1;
      if (candidate > 100) candidate = correctNum - Math.abs(offset) - 1;
      if (candidate < 1) candidate = 1;
      if (candidate > 100) candidate = 100;
      if (candidate !== correctNum) othersSet.add(candidate);
    }
    const opts = [correctNum, ...Array.from(othersSet)];
    currentOptions = opts.sort(() => Math.random() - 0.5).map(n => String(n));
    return;
  }

  const allWords = [];
  currentQuestions.forEach(item => {
    if (!allWords.includes(item.correct)) allWords.push(item.correct);
  });
  const others = allWords.filter(w => w !== currentCorrect);
  let opts = [currentCorrect];
  const shuffledOthers = others.sort(() => Math.random() - 0.5);
  for (let i = 0; i < Math.min(3, shuffledOthers.length); i++) {
    opts.push(shuffledOthers[i]);
  }
  currentOptions = opts.sort(() => Math.random() - 0.5);
}

function showQuizScreen() {
  stageSel.style.display = "none";
  resultsDiv.style.display = "none";
  quizDiv.style.display = "flex";
  renderQuestion();
}

function renderQuestion() {
  clearTimers();
  answered = false;
  const q = currentQuestions[currentIndex];

  questionLabel.textContent = q.question;
  stageLabel.textContent = stageData[currentStage].name;
  nameLabel.textContent = q.arabic;
  scoreLabel.textContent = `صح: ${stageData[currentStage].score}/${currentQuestions.length}`;
  errorsLabel.textContent = `الأخطاء: ${stageData[currentStage].wrong}`;

  if (currentStage === 2) {
    emojiDisplay.style.display = "none";
    colorCircleWrap.style.display = "flex";
    colorCircle.style.background = q.color;
    colorCircle.style.borderColor = (currentCorrect === "White") ? "#bfbfbf" : q.color;
  } else if (currentStage === 9) {
    colorCircleWrap.style.display = "none";
    emojiDisplay.style.display = "flex";
    emojiDisplay.textContent = "🔊";
    voiceTimers.push(setTimeout(() => speak(currentCorrect), 350));
  } else {
    colorCircleWrap.style.display = "none";
    emojiDisplay.style.display = "flex";
    const map = emojiMaps[currentStage] || {};
    emojiDisplay.textContent = map[currentCorrect] || (currentStage === 3 ? "🏫" : currentStage === 4 ? "🏠" : currentStage === 5 ? "🔵" : currentStage === 6 ? "🧍" : currentStage === 7 ? "🚗" : currentStage === 8 ? "👨‍⚕️" : "❓");
  }

  optionsDiv.innerHTML = "";
  currentOptions.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.textContent = opt;
    btn.dataset.index = i;
    btn.onclick = () => chooseAnswer(i);
    optionsDiv.appendChild(btn);
  });

  resultLabel.textContent = "";
  resultLabel.className = "";
}

function chooseAnswer(idx) {
  if (answered) return;
  answered = true;

  const selected = currentOptions[idx];
  speak(selected);

  const isCorrect = selected === currentCorrect;

  if (isCorrect) {
    stageData[currentStage].score++;
  } else {
    stageData[currentStage].wrong++;
  }
  scoreLabel.textContent = `صح: ${stageData[currentStage].score}/${currentQuestions.length}`;
  errorsLabel.textContent = `الأخطاء: ${stageData[currentStage].wrong}`;

  const allBtns = optionsDiv.querySelectorAll(".opt-btn");
  allBtns.forEach((b, i) => {
    if (currentOptions[i] === currentCorrect) {
      b.classList.add("correct");
    } else if (i === idx) {
      b.classList.add("wrong");
    } else {
      b.classList.add("disabled-other");
    }
  });

  if (isCorrect) {
    resultLabel.textContent = "✅ صحيح! أحسنت! 🎉";
    resultLabel.className = "correct-text";
  } else {
    resultLabel.textContent = `❌ خطأ! الإجابة الصحيحة: ${currentCorrect}`;
    resultLabel.className = "wrong-text";
  }

  if (isCorrect) {
    transitionTimer = setTimeout(() => nextQuestion(), 2000);
  } else {
    transitionTimer = setTimeout(() => {
      speak(currentCorrect);
      voiceTimers.push(setTimeout(() => {
        speak(currentCorrect);
        voiceTimers.push(setTimeout(() => nextQuestion(), 1000));
      }, 1000));
    }, 2000);
  }
}

function nextQuestion() {
  clearTimers();
  if (currentIndex < currentQuestions.length - 1) {
    currentIndex++;
    answered = false;
    loadQuestion();
    renderQuestion();
  } else {
    showResults();
  }
}

// ======================= RESULTS =======================
function getRating(percentage) {
  if (percentage >= 90) return ["🏆 ممتاز", "#008c00"];
  if (percentage >= 80) return ["🌟 جيد جدًا", "#1a66e6"];
  if (percentage >= 70) return ["👍 جيد", "#1a8cbf"];
  if (percentage >= 60) return ["🙂 مقبول", "#cc8000"];
  return ["💪 ضعيف — تحتاج تحسين", "#d91a1a"];
}

function showResults() {
  quizDiv.style.display = "none";
  resultsDiv.style.display = "flex";
  clearTimers();

  const total = currentQuestions.length;
  const score = stageData[currentStage].score;
  const pct = total > 0 ? (score / total) * 100 : 0;
  const [rating, ratingColor] = getRating(pct);
  const stageName = stageData[currentStage].name;

  let html = `<h2>🏆 نهاية ${stageName}</h2>
    <div class="final-score">نتيجتك: ${score}/${total}</div>
    <div class="percent">النسبة: ${Math.round(pct)}%</div>
    <div class="rating" style="color:${ratingColor}">التقدير: ${rating}</div>
    <button class="result-btn replay" onclick="showStageSelection()">🔄 هل تريد اللعب مرة أخرى؟</button>`;

  const canContinue = allStagesMode && currentStage < 9;
  if (canContinue) {
    html += `<button class="result-btn continue" onclick="continueToNextStage()">➡️ كمل</button>`;
  }

  html += `<button class="result-btn back" onclick="showStageSelection()">🏠 العودة لاختيار المرحلة</button>`;

  resultsDiv.innerHTML = html;
}

function continueToNextStage() {
  clearTimers();
  const next = currentStage + 1;
  if (next > 9) { showStageSelection(); return; }
  if (next === 9) {
    numberQuestions = generateNumberQuestions();
    stageData[9].questions = numberQuestions;
  }
  currentStage = next;
  currentIndex = 0;
  stageData[currentStage].score = 0;
  stageData[currentStage].wrong = 0;
  answered = false;
  loadQuestion();
  showQuizScreen();
}

window.showStageSelection = showStageSelection;
window.continueToNextStage = continueToNextStage;

window.onload = () => {
  showStageSelection();
};
</script>
