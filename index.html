<!doctype html>
<html lang="ar" dir="rtl">

<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>تعلم الإنجليزية</title>

<style>

body {
    margin: 0;
    background: #f5f7fb;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
    color: #172033;
}

.app {
    width: 100%;
    max-width: 620px;
    margin: auto;
    padding: 18px 14px 35px;
}

.header {
    text-align: center;
    padding: 10px 4px 16px;
}

.header h1 {
    font-size: 30px;
    margin: 0 0 6px;
}

.header p {
    margin: 0;
    color: #667085;
    font-size: 15px;
}

.card {
    background: white;
    border: 1px solid #d9dee8;
    border-radius: 20px;
    padding: 18px;
}

.stage-grid {
    display: grid;
    gap: 9px;
}

.stage-btn {
    border: 1px solid #d9dee8;
    background: #f8f9fc;
    border-radius: 15px;
    padding: 13px;
    min-height: 63px;
    font-size: 17px;
    font-weight: bold;
}

.quiz {
    display: none;
}

.question {
    font-size: 23px;
    font-weight: bold;
    text-align: center;
    min-height: 68px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.visual {
    height: 130px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 88px;
}

.color-circle {
    width: 125px;
    height: 125px;
    border-radius: 50%;
    border: 2px solid #bbb;
}

.stats {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 5px 0;
}

.error {
    color: #d93025;
}

.arabic-word {
    text-align: center;
    color: #b42318;
    font-size: 34px;
    font-weight: bold;
    min-height: 56px;
}

.options {
    display: grid;
    gap: 10px;
    margin-top: 12px;
}

.option {
    border: 2px solid #cdd3dd;
    background: #f1f3f6;
    color: #0d4db8;

    border-radius: 14px;
    padding: 12px;

    min-height: 54px;

    font-size: 21px;
    font-weight: bold;
}

.option.correct {
    background: #b9efc4;
    border-color: #16803a;
}

.option.wrong {
    background: #ffc1bc;
    border-color: #c62828;
}

.result {
    display: none;
    text-align: center;
    padding: 25px 10px;
}

.action {
    width: 100%;
    border: 0;
    border-radius: 14px;
    padding: 14px;
    margin-top: 12px;

    font-size: 20px;
    font-weight: bold;
}

.primary {
    background: #0f62fe;
    color: white;
}

.success {
    background: #169c45;
    color: white;
}

.secondary {
    background: #eef0f4;
}

</style>
</head>


<body>

<div class="app">

    <!-- الصفحة الرئيسية -->

    <div class="header" id="homeHeader">

        <h1>
            🎓 تعلم الإنجليزية
        </h1>

        <p>
            اختر المرحلة وابدأ الاختبار
        </p>

    </div>


    <!-- اختيار المراحل -->

    <section class="card" id="selection">

        <div
            class="stage-grid"
            id="stageGrid">
        </div>

    </section>


    <!-- صفحة الأسئلة -->

    <section
        class="card quiz"
        id="quizCard">

        <div class="topbar">

            <div
                class="stage-name"
                id="stageName">
            </div>

            <div
                class="counter"
                id="counter">
            </div>

        </div>


        <div
            class="question"
            id="question">
        </div>


        <div
            class="visual"
            id="visual">
        </div>


        <div class="stats">

            <div
                id="score">
            </div>

            <div
                class="error"
                id="errors">
            </div>

        </div>


        <div
            class="arabic-word"
            id="arabicWord">
        </div>


        <div
            class="options"
            id="options">
        </div>


        <button
            class="action secondary"
            id="homeBtn">

            🏠 اختيار مرحلة أخرى

        </button>

    </section>


    <!-- صفحة النتيجة -->

    <section
        class="card result"
        id="resultCard">

        <h2 id="resultTitle"></h2>

        <div id="resultScore"></div>

        <div id="resultPercent"></div>

        <div id="resultRating"></div>

        <div id="resultInfo"></div>


        <button
            class="action primary"
            id="againBtn">

            🔄 اللعب مرة أخرى

        </button>


        <button
            class="action success"
            id="continueBtn">

            ➡️ كمل

        </button>


        <button
            class="action secondary"
            id="resultHomeBtn">

            🏠 العودة لاختيار المرحلة

        </button>

    </section>

</div>


<script>

/* =========================
   بيانات المراحل
   ========================= */

const stages = {

    1: {
        icon: "🍎🥕",
        name: "الفواكه والخضروات",

        data: [

            {
                arabic: "🍎 تفاحة 🍎",
                correct: "Apple",
                question:
                    "ما هو الاسم الإنجليزي لهذه الفاكهة؟"
            },

            {
                arabic: "🍌 موز 🍌",
                correct: "Banana",
                question:
                    "ما هو الاسم الإنجليزي لهذه الفاكهة؟"
            },

            {
                arabic: "🍊 برتقال 🍊",
                correct: "Orange",
                question:
                    "ما هو الاسم الإنجليزي لهذه الفاكهة؟"
            },

            {
                arabic: "🍓 فراولة 🍓",
                correct: "Strawberry",
                question:
                    "ما هو الاسم الإنجليزي لهذه الفاكهة؟"
            },

            {
                arabic: "🍇 عنب 🍇",
                correct: "Grapes",
                question:
                    "ما هو الاسم الإنجليزي لهذه الفاكهة؟"
            },

            {
                arabic: "🍉 بطيخ 🍉",
                correct: "Watermelon",
                question:
                    "ما هو الاسم الإنجليزي لهذه الفاكهة؟"
            }

            // بقية أسئلة المرحلة هنا

        ]
    },


    2: {

        icon: "🎨",

        name: "الألوان",

        data: [

            {
                arabic: "🔴 أحمر",
                correct: "Red",
                question:
                    "ما هو الاسم الإنجليزي لهذا اللون؟",
                color: [0.95, 0.08, 0.08]
            },

            {
                arabic: "🔵 أزرق",
                correct: "Blue",
                question:
                    "ما هو الاسم الإنجليزي لهذا اللون؟",
                color: [0.08, 0.38, 0.95]
            }

            // بقية الألوان

        ]
    }

};


/* =========================
   المتغيرات
   ========================= */

let stage = 1;

let index = 0;

let score = 0;

let wrong = 0;

let answered = false;

let allStages = false;

let questions = [];


/* =========================
   الاختصارات
   ========================= */

const $ = id =>
    document.getElementById(id);


/* =========================
   اختيار المراحل
   ========================= */

function buildSelection() {

    const grid =
        $("stageGrid");

    grid.innerHTML = "";


    Object.entries(stages)
        .forEach(([id, s]) => {

            const button =
                document.createElement("button");

            button.className =
                "stage-btn";


            button.innerHTML = `

                <strong>
                    ${s.icon}
                    المرحلة ${id}
                </strong>

                <small>
                    ${s.name}
                    —
                    ${s.data.length}
                    سؤال
                </small>

            `;


            button.onclick = () => {

                startStage(
                    Number(id),
                    false
                );

            };


            grid.appendChild(button);

        });


    const allButton =
        document.createElement("button");

    allButton.className =
        "stage-btn";


    allButton.innerHTML = `

        <strong>
            📚 جميع المراحل
        </strong>

        <small>
            ابدأ من المرحلة الأولى
            وانتقل بالتتابع
        </small>

    `;


    allButton.onclick = () => {

        startStage(1, true);

    };


    grid.appendChild(allButton);
}


/* =========================
   النطق
   ========================= */

function speak(text) {

    if (
        "speechSynthesis"
        in window
    ) {

        speechSynthesis.cancel();


        const voice =
            new SpeechSynthesisUtterance(
                text
            );


        voice.lang =
            "en-US";


        voice.rate =
            0.45;


        speechSynthesis.speak(
            voice
        );
    }
}


/* =========================
   بدء المرحلة
   ========================= */

function startStage(
    id,
    all = false
) {

    stage = id;

    allStages = all;

    index = 0;

    score = 0;

    wrong = 0;

    answered = false;


    loadQuestions();


    $("selection")
        .style.display =
        "none";


    $("homeHeader")
        .style.display =
        "none";


    $("resultCard")
        .style.display =
        "none";


    $("quizCard")
        .style.display =
        "block";


    renderQuestion();
}


/* =========================
   تحميل الأسئلة
   ========================= */

function loadQuestions() {

    questions =
        stages[String(stage)]
        .data
        .map(q => ({
            ...q
        }));
}


/* =========================
   إنشاء الإجابات
   ========================= */

function getOptions(correct) {

    const words =
        [
            ...new Set(
                questions.map(
                    q => q.correct
                )
            )
        ];


    const others =
        words.filter(
            w => w !== correct
        );


    const options = [

        correct,

        ...others
            .sort(
                () =>
                    Math.random() - 0.5
            )
            .slice(0, 3)

    ];


    return options.sort(
        () =>
            Math.random() - 0.5
    );
}


/* =========================
   عرض السؤال
   ========================= */

function renderQuestion() {

    const q =
        questions[index];


    $("stageName")
        .textContent =
        `${stages[String(stage)].icon}
         المرحلة ${stage}
         —
         ${stages[String(stage)].name}`;


    $("counter")
        .textContent =
        `السؤال ${index + 1}
         / ${questions.length}`;


    $("question")
        .textContent =
        q.question;


    $("arabicWord")
        .textContent =
        q.arabic;


    $("score")
        .textContent =
        `صح: ${score}/${questions.length}`;


    $("errors")
        .textContent =
        `الأخطاء: ${wrong}`;


    const visual =
        $("visual");


    visual.innerHTML = "";


    if (stage === 2) {

        const circle =
            document.createElement(
                "div"
            );


        circle.className =
            "color-circle";


        if (q.color) {

            circle.style.background =
                `rgb(
                    ${Math.round(q.color[0] * 255)},
                    ${Math.round(q.color[1] * 255)},
                    ${Math.round(q.color[2] * 255)}
                )`;

        }


        visual.appendChild(
            circle
        );

    }


    const optionsBox =
        $("options");


    optionsBox.innerHTML = "";


    answered = false;


    getOptions(q.correct)
        .forEach(
            (option, i) => {

                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "option";


                button.textContent =
                    option;


                button.onclick =
                    () => {

                        choose(
                            button,
                            option,
                            q.correct
                        );

                    };


                optionsBox.appendChild(
                    button
                );

            }
        );
}


/* =========================
   اختيار الإجابة
   ========================= */

function choose(
    button,
    selected,
    correct
) {

    if (answered)
        return;


    answered = true;


    speak(selected);


    const buttons =
        [
            ...$("options")
                .children
        ];


    const isCorrect =
        selected === correct;


    if (isCorrect) {

        score++;

    } else {

        wrong++;

    }


    $("score")
        .textContent =
        `صح: ${score}/${questions.length}`;


    $("errors")
        .textContent =
        `الأخطاء: ${wrong}`;


    buttons.forEach(
        b => {

            if (
                b.textContent ===
                correct
            ) {

                b.classList.add(
                    "correct"
                );

            }

            else if (
                b === button
            ) {

                b.classList.add(
                    "wrong"
                );

            }

        }
    );


    if (isCorrect) {

        setTimeout(
            nextQuestion,
            2000
        );

    }

    else {

        setTimeout(
            () => {

                speak(correct);


                setTimeout(
                    () => {

                        speak(correct);


                        setTimeout(
                            nextQuestion,
                            1000
                        );

                    },
                    1000
                );

            },
            2000
        );

    }
}


/* =========================
   السؤال التالي
   ========================= */

function nextQuestion() {

    if (
        index <
        questions.length - 1
    ) {

        index++;

        renderQuestion();

    }

    else {

        showResult();

    }
}


/* =========================
   التقييم
   ========================= */

function rating(
    percentage
) {

    if (percentage >= 90)

        return "🏆 ممتاز";


    if (percentage >= 80)

        return "🌟 جيد جدًا";


    if (percentage >= 70)

        return "👍 جيد";


    if (percentage >= 60)

        return "🙂 مقبول";


    return "💪 ضعيف — تحتاج تحسين";
}


/* =========================
   النتيجة
   ========================= */

function showResult() {

    const total =
        questions.length;


    const percentage =
        score / total * 100;


    $("quizCard")
        .style.display =
        "none";


    $("resultCard")
        .style.display =
        "block";


    $("resultTitle")
        .textContent =
        `🏆 نهاية المرحلة ${stage}`;


    $("resultScore")
        .textContent =
        `نتيجتك: ${score}/${total}`;


    $("resultPercent")
        .textContent =
        `النسبة: ${percentage.toFixed(0)}%`;


    $("resultRating")
        .textContent =
        `التقدير: ${rating(percentage)}`;


    $("resultInfo")
        .textContent =
        `${stages[String(stage)].icon}
         ${stages[String(stage)].name}`;


    $("continueBtn")
        .style.display =
        (
            allStages &&
            stage < 8
        )
        ? "block"
        : "none";
}


/* =========================
   الأزرار
   ========================= */

$("againBtn").onclick =
    () => {

        startStage(
            stage,
            allStages
        );

    };


$("continueBtn").onclick =
    () => {

        startStage(
            stage + 1,
            true
        );

    };


$("homeBtn").onclick =
    home;


$("resultHomeBtn").onclick =
    home;


/* =========================
   العودة للرئيسية
   ========================= */

function home() {

    if (
        "speechSynthesis"
        in window
    ) {

        speechSynthesis.cancel();

    }


    $("resultCard")
        .style.display =
        "none";


    $("quizCard")
        .style.display =
        "none";


    $("selection")
        .style.display =
        "block";


    $("homeHeader")
        .style.display =
        "block";


    buildSelection();
}


/* =========================
   تشغيل البرنامج
   ========================= */

buildSelection();

</script>

</body>
</html>
